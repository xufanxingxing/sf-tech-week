<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stoody AI: Tech Week 去哪儿</title>
<link rel="icon" type="image/png" href="logo.png">
<meta name="description" content="SF Tech Week 值得去的活动，和群里谁会去。">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
#list { display: flex; flex-direction: column; gap: 18px; }
/* Layout: one narrow column, an agenda grouped by day. Each event is a row with the time in a left rail, the pitch in the middle, and who is going underneath. */
:root {
  --bg: #f3f4f5;
  --surface: #ffffff;
  --fg: #131517;
  --muted: #737577;
  --line: #e4e5e7;
  --card-line: #ffffff;
  --faint: #9a9c9f;
  --tint: #fceaf0;
  --tint-line: #f3c6d5;
  --tint-fg: #a8325c;
  --accent: #c2557a;
  --accent-fg: #ffffff;
  --accent-soft: #eef0f2;
  --pick: #a8325c;
  --pick-soft: #fceaf0;
  --danger: #b3261e;
  --shadow: 0 1px 4px rgba(19, 21, 23, .03);
  --display: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: var(--body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131517; --surface: #1e2022; --fg: #f2f3f4; --muted: #9a9c9e; --line: #2e3033;
    --accent: #e08aa6; --accent-fg: #3a0a1c; --accent-soft: #2a2c2f; --card-line: #2e3033; --faint: #7d7f82; --tint: #3a1a27; --tint-line: #5c2a3d; --tint-fg: #f4a9c2;
    --pick: #f9a8c4; --pick-soft: #3d1626; --danger: #f2877f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131517; --surface: #1e2022; --fg: #f2f3f4; --muted: #9a9c9e; --line: #2e3033;
    --accent: #e08aa6; --accent-fg: #3a0a1c; --accent-soft: #2a2c2f; --card-line: #2e3033; --faint: #7d7f82; --tint: #3a1a27; --tint-line: #5c2a3d; --tint-fg: #f4a9c2;
    --pick: #f9a8c4; --pick-soft: #3d1626; --danger: #f2877f;
  --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 80px; display: flex; flex-direction: column; gap: 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.top h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 5vw, 30px); line-height: 1.25; margin: 0; text-wrap: balance; }
.top h1 { display: flex; align-items: center; gap: 12px; }
.top h1 span { min-width: 0; }
.logo { flex: none; width: 40px; height: 40px; border-radius: 10px; background: #fff; padding: 4px; box-sizing: border-box; object-fit: contain; }
.top p { margin: 6px 0 0; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { opacity: .88; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; border-block: 1px solid var(--line); padding-block: 10px; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 5px 12px; border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 500; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.me { color: var(--muted); font-size: 13px; }
.link { border: 0; background: none; padding: 0; color: var(--fg); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

.allbar { display: flex; flex-direction: column; gap: 10px; }
.days { display: flex; flex-wrap: wrap; gap: 4px; }
.days .tab { border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.days .tab[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); box-shadow: none; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.src { margin: 0; font-size: 13px; color: var(--muted); }
#stats { margin-block: -10px; }
.src a { color: inherit; text-underline-offset: 3px; }
.intro { margin: 2px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.badge.official { color: var(--muted); background: var(--accent-soft); }
.notice { background: var(--accent-soft); color: var(--fg); border-radius: 10px; padding: 10px 14px; font-size: 14px; }

/* Agenda */
.day { display: flex; flex-direction: column; gap: 10px; }
.day h2 { font-family: var(--display); font-size: 16px; font-weight: 600; margin: 8px 0 0; display: flex; align-items: baseline; gap: 10px; }
.day h2 small { font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--muted); }

.event { background: var(--surface); border: 1px solid var(--card-line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.time { color: var(--faint); font-size: 15px; font-variant-numeric: tabular-nums; display: flex; gap: 5px; }
.time b { font-weight: 400; }
.time i { font-style: normal; }
.main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.head h3 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 600; overflow-wrap: anywhere; }
.head h3 a { color: inherit; text-decoration: none; }
.head h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.head h3 .ext { color: var(--accent); font-weight: 400; }
.badge { font-size: 12px; font-weight: 500; color: var(--pick); background: var(--pick-soft); padding: 1px 7px; border-radius: 5px; white-space: nowrap; }
.where, .by { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: flex-start; }
.where { color: var(--faint); }
.where svg, .by svg { flex: none; width: 15px; height: 15px; margin-top: 4px; }
.why { margin: 4px 0 2px; font-size: 14px; line-height: 1.65; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.whylabel { display: inline-block; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--accent-soft); border-radius: 5px; padding: 0 6px; margin-right: 6px; line-height: 1.7; }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
.go[aria-pressed="true"] { background: var(--tint); border-color: var(--tint-line); color: var(--tint-fg); }
a.btn { text-decoration: none; color: var(--fg); }
.spacer { flex: 1; }
.del { font-size: 13px; color: var(--muted); }
.del.sure { color: var(--danger); }

/* Who's going: one row of names tagged with their status, at most two lines (app.js trims it), the rest behind the "全部" button. */
.going { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.grp { display: flex; flex-wrap: wrap; gap: 6px; }
.count { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 25px; background: var(--accent-soft); border: 1px solid transparent; border-radius: 6px; padding: 0 8px; font-size: 13px; max-width: 100%; white-space: nowrap; }
.chip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.going .nm { max-width: 8em; }
.chip i { font-style: normal; font-size: 12px; color: var(--muted); }
.chip.mine { background: var(--tint); border-color: var(--tint-line); color: var(--tint-fg); font-weight: 500; }
.chip.mine i { color: inherit; font-weight: 400; opacity: .8; }
.chip.more { position: relative; background: var(--surface); border-color: var(--line); color: var(--muted); font-weight: 500; }
.chip.more::after { content: ""; position: absolute; inset: -8px -4px; } /* a finger-sized target around a chip-sized button */
.chip.more:hover, .chip.more[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

.cbtn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; min-height: 32px; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn:hover, .cbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.cbtn.has { background: var(--tint); border-color: var(--tint-line); color: var(--tint-fg); }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 5; width: min(380px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(19, 21, 23, .08); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 900px) { body.drawer-open { padding-right: 380px; } }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dhead strong { font-size: 15px; }
.dclose { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
.dclose:hover { color: var(--fg); background: var(--accent-soft); }
.dscroll { flex: 1; overflow-y: auto; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.devent { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
#pList { display: flex; flex-direction: column; gap: 16px; }
#pList section { display: flex; flex-direction: column; gap: 6px; }
#pList h3 { margin: 0; }
.dcompose { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#dName { font-size: 14px; font-weight: 600; }
#dInput { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; resize: vertical; min-height: 40px; font-family: inherit; }
.dcompose .foot { display: flex; justify-content: flex-end; }
#dList { display: flex; flex-direction: column; gap: 10px; }
.comment { font-size: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.comment strong { font-weight: 600; }
.comment p { margin: 2px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.cnone { margin: 0; color: var(--muted); font-size: 14px; }
.ctime { color: var(--faint); font-size: 12px; margin-left: 8px; }
.cdel { font-size: 12px; color: var(--faint); margin-left: 8px; }
.empty { text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 40px 16px; }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

/* Dialogs */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(8, 14, 14, .55); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
dialog h2 { font-family: var(--display); margin: 0; font-size: 20px; font-weight: 600; }
dialog p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field label i { font-style: normal; font-weight: 400; color: var(--muted); }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.field textarea { resize: vertical; min-height: 84px; }
.row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
#dates { display: flex; flex-direction: column; gap: 8px; }
.row.extra { grid-template-columns: 1.3fr 1fr 1fr auto; align-items: center; }
.row.extra .link { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; }
.foot { display: flex; justify-content: flex-end; gap: 8px; }

#toast { z-index: 10; position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; }

@media (max-width: 520px) {
  .row { grid-template-columns: 1fr 1fr; }
  .row .field:first-child { grid-column: 1 / -1; }
  .row.extra { grid-template-columns: 1fr 1fr auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><img class="logo" src="logo.png" alt="" width="40" height="40"><span>Stoody AI: Tech Week 去哪儿</span></h1>
      <p>SF Tech Week 值得去的活动，和群里谁会去。</p>
    </div>
    <button class="btn primary" id="addBtn" type="button">＋ 添加活动</button>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="筛选">
      <button class="tab" id="tabPicks" type="button" aria-pressed="true">推荐</button>
      <button class="tab" id="tabAll" type="button" aria-pressed="false">全部</button>
      <button class="tab" id="tabMine" type="button" aria-pressed="false">我标记的</button>
    </div>
    <div class="me" id="me"></div>
  </div>
  <p class="src" id="stats" hidden></p>

  <div class="notice" id="notice" hidden></div>
  <div class="allbar" id="allbar" hidden>
    <div class="days" id="days" role="group" aria-label="日期"></div>
    <input class="search" id="search" type="search" maxlength="60" placeholder="搜索活动名、主办方或地点" aria-label="搜索全部活动">
    <p class="src" id="src"></p>
  </div>
  <main id="list"></main>
</div>

<dialog id="eventDlg">
  <form id="eventForm" novalidate>
    <h2>添加活动</h2>
    <p>任何人都可以加。五项都填好，大家才好判断要不要去。</p>
    <div class="field"><label for="fName">活动名称</label><input id="fName" maxlength="120" required></div>
    <div class="field"><label for="fLink">报名链接</label><input id="fLink" type="url" inputmode="url" placeholder="https://lu.ma/…" maxlength="500" required></div>
    <div id="dates">
      <div class="row">
        <div class="field"><label for="fDate">日期</label><input id="fDate" type="date" required></div>
        <div class="field"><label for="fStart">开始</label><input id="fStart" type="time" required></div>
        <div class="field"><label for="fEnd">结束 <i>可不填</i></label><input id="fEnd" type="time"></div>
      </div>
    </div>
    <div><button class="link" type="button" id="addDate">＋ 添加日期</button></div>
    <div class="field"><label for="fWhere">地点</label><input id="fWhere" maxlength="200" placeholder="场地名或地址" required></div>
    <div class="field"><label for="fWhy">为什么值得去</label><textarea id="fWhy" maxlength="600" placeholder="谁办的、谁会来、能收获什么" required></textarea></div>
    <div class="field"><label for="fBy">你的名字</label><input id="fBy" maxlength="30" placeholder="群里大家认得的名字" required></div>
    <div class="err" id="eventErr" hidden></div>
    <div class="foot">
      <button class="btn" type="button" id="eventCancel">取消</button>
      <button class="btn primary" type="submit" id="eventSave">添加</button>
    </div>
  </form>
</dialog>

<dialog id="nameDlg">
  <form id="nameForm" novalidate>
    <h2>你的名字</h2>
    <p>会显示在你标记的活动下面，用群里大家认得的名字。</p>
    <div class="field"><label for="nName">名字</label><input id="nName" maxlength="30" required></div>
    <div class="foot">
      <button class="btn" type="button" id="nameCancel">取消</button>
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<aside class="drawer" id="drawer" aria-label="留言" hidden>
  <div class="dhead"><strong id="dTitle">留言</strong><button class="dclose" id="dClose" type="button" aria-label="关闭留言">×</button></div>
  <div class="dscroll">
    <div class="devent" id="dEvent"></div>
    <div class="dcompose">
      <div id="dName"></div>
      <textarea id="dInput" rows="2" maxlength="300" placeholder="写一句留言…" aria-label="留言"></textarea>
      <div class="foot"><button class="btn primary" id="dSend" type="button">发送</button></div>
    </div>
    <div id="dList"></div>
  </div>
</aside>

<aside class="drawer" id="people" aria-label="已标记的人" hidden>
  <div class="dhead"><strong id="pTitle">已标记</strong><button class="dclose" id="pClose" type="button" aria-label="关闭名单">×</button></div>
  <div class="dscroll">
    <div class="devent" id="pEvent"></div>
    <div id="pList"></div>
  </div>
</aside>

<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=21"></script>
<script src="app.js?v=21"></script>
</body>
</html>
